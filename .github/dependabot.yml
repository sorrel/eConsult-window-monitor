# Routine version bumps. Dependabot security updates are already on and are
# separate from this — they fire on an advisory regardless of schedule.
#
# The runtime is deliberately near-dependency-free (Click only; the daemon
# itself is standard-library), so this stays quiet by design. Grouped into a
# single PR so a quiet repo doesn't turn into a stream of noise.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # Keeps the SHA-pinned actions in tests.yml current (the "# vX.Y.Z" comment
  # beside each pin is updated with it).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
